# Laheey Commerce Warehouse: Postgres + the System API
#   docker compose up -d           start both
#   npm run generate:s             load 1M rows (s), 3M (m) or 10M (l)
services:
  db:
    image: postgres:16
    container_name: laheey-warehouse-db
    environment:
      POSTGRES_USER: laheey
      POSTGRES_PASSWORD: laheey
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    # More memory for index builds on the 10M-row scale
    command: ["postgres", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=4GB", "-c", "shared_buffers=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laheey -d warehouse"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    container_name: laheey-warehouse-api
    environment:
      DATABASE_URL: postgres://laheey:laheey@db:5432/warehouse
      API_KEY: ${API_KEY:-dev-only-change-me}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  warehouse-data:
