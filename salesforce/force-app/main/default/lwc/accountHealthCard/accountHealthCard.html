<template>
    <lightning-card title="Account Health" icon-name="standard:account_score">
        <lightning-button slot="actions" label="Refresh from warehouse" onclick={handleRefresh} disabled={refreshing}></lightning-button>

        <template lwc:if={view}>
            <div class="slds-p-horizontal_medium">
                <div class="summary">
                    <div class={scoreClass}>
                        <span class="score">{view.health.score}</span>
                        <span class="out-of">/100</span>
                    </div>
                    <div>
                        <p class="status">{view.health.status}</p>
                        <ul class="reasons">
                            <template for:each={view.health.reasons} for:item="reason">
                                <li key={reason}>{reason}</li>
                            </template>
                        </ul>
                    </div>
                </div>

                <dl class="slds-grid slds-wrap slds-m-top_small facts">
                    <div class="slds-col slds-size_1-of-2"><dt>12-month revenue</dt><dd><lightning-formatted-number value={view.revenue12m} format-style="currency" currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number></dd></div>
                    <div class="slds-col slds-size_1-of-2"><dt>Last order</dt><dd><lightning-formatted-date-time value={view.lastOrderDate} time-zone="UTC"></lightning-formatted-date-time></dd></div>
                    <div class="slds-col slds-size_1-of-2"><dt>Open cases</dt><dd>{view.openCases}</dd></div>
                    <div class="slds-col slds-size_1-of-2"><dt>Last synced</dt><dd><lightning-relative-date-time value={view.lastSynced}></lightning-relative-date-time></dd></div>
                </dl>

                <template lwc:if={hasMonths}>
                    <p class="slds-text-title_caps slds-m-top_medium">Monthly revenue</p>
                    <div class="chart" role="img" aria-label={chartLabel}>
                        <template for:each={bars} for:item="bar">
                            <div key={bar.label} class="bar-col" title={bar.title}>
                                <div class="bar" style={bar.style}></div>
                                <span class="bar-label">{bar.short}</span>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-m-top_medium slds-text-color_weak">No monthly metrics yet. Run the warehouse sync or load metrics.csv.</p>
                </template>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="slds-p-horizontal_medium slds-text-color_error">{error}</div>
        </template>
    </lightning-card>
</template>
